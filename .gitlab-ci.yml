# GitLab CI/CD Pipeline for nrest.nvim
# Runs automated tests on every push and merge request

image: alpine:latest

# Define stages
stages:
  - test
  - security
  - build

# Cache dependencies between jobs
cache:
  paths:
    - .local/

# Run tests on multiple Neovim versions
.test_template: &test_template
  stage: test
  before_script:
    # Install dependencies
    - apk add --no-cache git curl bash neovim
    # Install plenary.nvim for testing
    - mkdir -p ~/.local/share/nvim/site/pack/vendor/start
    - |
      if [ ! -d ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim ]; then
        git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
      fi
  script:
    # Show Neovim version
    - nvim --version
    # Run test suite
    - nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua'}"
  tags:
    - docker
    - linux

# Test on stable Neovim (from Alpine packages)
test:neovim-stable:
  <<: *test_template
  only:
    - branches
    - merge_requests
    - tags

# Test with latest Neovim from source (optional, runs only on main)
test:neovim-latest:
  stage: test
  image: ubuntu:latest
  before_script:
    # Install build dependencies
    - apt-get update
    - apt-get install -y git curl build-essential cmake gettext ninja-build unzip
    # Build Neovim from source (latest stable tag)
    - git clone --depth 1 --branch stable https://github.com/neovim/neovim /tmp/neovim
    - cd /tmp/neovim
    - make CMAKE_BUILD_TYPE=RelWithDebInfo
    - make install
    - cd -
    # Install plenary.nvim
    - mkdir -p ~/.local/share/nvim/site/pack/vendor/start
    - git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
  script:
    # Show Neovim version
    - nvim --version
    # Run test suite
    - nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua'}"
  only:
    - main
    - develop
  tags:
    - docker
  allow_failure: true  # Don't block pipeline if latest build fails

# Optional: Lint with luacheck
lint:luacheck:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache luarocks gcc musl-dev
    - export PATH=$PATH:/usr/local/bin:/usr/bin
    - which luarocks || echo "luarocks not in PATH"
    - /usr/bin/luarocks install luacheck
  script:
    - export PATH=$PATH:/usr/local/bin:/root/.luarocks/bin
    - which luacheck || echo "luacheck not in PATH"
    - luacheck lua/ --globals vim --no-unused-args
  only:
    - merge_requests
  tags:
    - docker
    - linux
  allow_failure: true  # Don't block on linting issues

# Optional: Check health (requires full Neovim setup)
check:health:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache neovim curl
  script:
    # Basic check that plugin loads
    - nvim --headless -u NONE -c "set runtimepath+=." -c "lua require('nrest')" -c "quit"
    - echo "Plugin loads successfully"
  only:
    - main
    - merge_requests
  tags:
    - docker
    - linux
  allow_failure: true

# ============================================
# Security Scanning Stage
# ============================================

# Secret Detection - Scan for leaked credentials
secrets-detection:
  stage: security
  image: alpine:latest
  variables:
    GIT_STRATEGY: clone  # Force fresh clone to avoid cached old history
  before_script:
    - apk add --no-cache git curl
    # Install gitleaks
    - |
      GITLEAKS_VERSION="8.18.4"
      curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin
      chmod +x /usr/local/bin/gitleaks
  script:
    - echo "🔍 Scanning for secrets with gitleaks..."
    - gitleaks detect --verbose --redact --config .gitleaks.toml
  only:
    - branches
    - merge_requests
  tags:
    - docker
    - linux
  allow_failure: false  # Block pipeline if secrets are found

# SAST (Static Application Security Testing)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Override SAST settings - extend existing rules
semgrep-sast:
  tags:
    - docker
    - linux
  variables:
    SAST_EXCLUDED_PATHS: "tests/,docker/"
  allow_failure: true  # Don't block on SAST findings initially

# Override Secret Detection settings - extend existing rules
secret_detection:
  tags:
    - docker
    - linux
  allow_failure: false  # Block if secrets detected

# Override Dependency scanning - extend existing rules
gemnasium-dependency_scanning:
  tags:
    - docker
    - linux
  allow_failure: true  # Don't block on dependency issues

# Build and publish Docker demo image (only on main branch)
build:docker-demo:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: $CI_REGISTRY_IMAGE/demo
  before_script:
    # Login to GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker demo image..."
    - docker build -f docker/Dockerfile -t $IMAGE_NAME:latest .
    - echo "Testing Docker image..."
    - docker run --rm $IMAGE_NAME:latest nvim --version
    - docker run --rm $IMAGE_NAME:latest ls -la /home/nvim/demo/
    - echo "Pushing Docker image to registry..."
    - docker push $IMAGE_NAME:latest
    - echo "Docker image published successfully!"
    - echo "Pull with docker pull $IMAGE_NAME:latest"
  after_script:
    - echo "Cleaning up old images..."
    - apk add --no-cache curl jq || true
    - |
      REPO_ID=$(curl -s -H "PRIVATE-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" | jq -r '.[] | select(.path | contains("demo")) | .id' 2>/dev/null || echo "")
      if [ -n "$REPO_ID" ]; then
        echo "Found demo repository ID: $REPO_ID"
        curl -s -H "PRIVATE-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags" 2>/dev/null | jq -r '.[].name' | grep -v "^latest$" | while read tag; do
          echo "Deleting old tag: $tag"
          curl -X DELETE -H "PRIVATE-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags/$tag" 2>/dev/null || true
        done
        echo "Cleanup completed - only 'latest' tag remains"
      else
        echo "Demo repository not found or first build - skipping cleanup"
      fi
  only:
    - main
  tags:
    - docker

